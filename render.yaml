services:
  - type: web
    name: secret-agent-demo
    runtime: python
    plan: free
    buildCommand: python3 -m py_compile demo.py liquid_agent.py webapp.py
    startCommand: python3 webapp.py
    healthCheckPath: /api/health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: COMMONTASKS_MODEL
        value: liquid/lfm-2.5-2.6b:free
